services:
  - type: web
    name: car-bike-rental
    runtime: java
    plan: free
    buildCommand: mvn clean package -DskipTests
    startCommand: java -jar target/car-bike-rental-0.0.1-SNAPSHOT.jar
    envVars:
      - key: spring.mongodb.uri
        sync: false
      - key: spring.mongodb.database
        value: rental_db
    healthCheckPath: /
    autoDeploy: true