<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Add Vehicle</title>

</head>

<body>

<h1>Add New Vehicle</h1>

<form action="/admin/vehicles/save"
      method="post"
      th:object="${vehicle}">

    <label>Vehicle Type:</label>

    <select th:field="*{type}" required>

        <option value="">Select Type</option>

        <option value="CAR">Car</option>

        <option value="BIKE">Bike</option>

    </select>

    <br><br>


    <label>Company:</label>

    <input type="text"
           th:field="*{company}"
           placeholder="Example: Toyota"
           required>

    <br><br>


    <label>Model:</label>

    <input type="text"
           th:field="*{model}"
           placeholder="Example: Fortuner"
           required>

    <br><br>


    <label>Vehicle Number:</label>

    <input type="text"
           th:field="*{vehicleNumber}"
           placeholder="Example: KA01AB1234"
           required>

    <br><br>


    <label>Description:</label>

    <textarea th:field="*{description}"
              placeholder="Enter vehicle description">
    </textarea>

    <br><br>


    <label>Price Per Day:</label>

    <input type="number"
           step="0.01"
           th:field="*{pricePerDay}"
           required>

    <br><br>


    <label>Fuel Type:</label>

    <select th:field="*{fuelType}">

        <option value="PETROL">Petrol</option>

        <option value="DIESEL">Diesel</option>

        <option value="ELECTRIC">Electric</option>

        <option value="HYBRID">Hybrid</option>

    </select>

    <br><br>


    <label>Seating Capacity:</label>

    <input type="number"
           th:field="*{seatingCapacity}"
           required>

    <br><br>


    <label>Image URL:</label>

    <input type="text"
           th:field="*{imageUrl}"
           placeholder="Enter image URL">

    <br><br>


    <label>Available:</label>

    <select th:field="*{available}">

        <option value="true">Yes</option>

        <option value="false">No</option>

    </select>

    <br><br>


    <button type="submit">
        Save Vehicle
    </button>

</form>

<br>

<a href="/admin/vehicles">
    Back to Vehicles
</a>

</body>

</html>
