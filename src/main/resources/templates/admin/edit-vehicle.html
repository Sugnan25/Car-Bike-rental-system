<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Edit Vehicle</title>

</head>

<body>

<h1>Edit Vehicle</h1>

<form action="/admin/vehicles/update"
      method="post"
      th:object="${vehicle}">

    <!-- Hidden ID -->
    <input type="hidden"
           th:field="*{id}">


    <label>Vehicle Type:</label>

    <select th:field="*{type}"
            required>

        <option value="CAR">
            Car
        </option>

        <option value="BIKE">
            Bike
        </option>

    </select>

    <br><br>


    <label>Company:</label>

    <input type="text"
           th:field="*{company}"
           required>

    <br><br>


    <label>Model:</label>

    <input type="text"
           th:field="*{model}"
           required>

    <br><br>


    <label>Vehicle Number:</label>

    <input type="text"
           th:field="*{vehicleNumber}"
           required>

    <br><br>


    <label>Description:</label>

    <textarea th:field="*{description}">
    </textarea>

    <br><br>


    <label>Price Per Day:</label>

    <input type="number"
           step="0.01"
           th:field="*{pricePerDay}"
           required>

    <br><br>


    <label>Fuel Type:</label>

    <select th:field="*{fuelType}">

        <option value="PETROL">
            Petrol
        </option>

        <option value="DIESEL">
            Diesel
        </option>

        <option value="ELECTRIC">
            Electric
        </option>

        <option value="HYBRID">
            Hybrid
        </option>

    </select>

    <br><br>


    <label>Seating Capacity:</label>

    <input type="number"
           th:field="*{seatingCapacity}"
           required>

    <br><br>


    <!-- Temporary Image URL -->
    <label>Image URL:</label>

    <input type="text"
           th:field="*{imageUrl}">

    <br><br>


    <label>Available:</label>

    <select th:field="*{available}">

        <option value="true">
            Yes
        </option>

        <option value="false">
            No
        </option>

    </select>

    <br><br>


    <button type="submit">
        Update Vehicle
    </button>

</form>

<br>

<a href="/admin/vehicles">
    Back to Vehicles
</a>

</body>

</html>
