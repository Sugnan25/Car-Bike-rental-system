<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Vehicles</title>
    <link rel="stylesheet" th:href="@{/css/admin-vehicles.css}">
</head>
<body>

    <nav class="navbar">
        <a href="/admin" class="navbar-brand">CARBIKE <span>Admin</span></a>
        <div class="nav-right">
            <a href="/admin" class="nav-link btn-back">Dashboard</a>
        </div>
    </nav>

    <div class="container">
        <div class="header">
            <h1>Manage Vehicles</h1>
            <div style="display:flex; gap:10px;">
                <a href="/admin/vehicles/clear" class="btn-clear"
                   onclick="return confirm('Are you sure you want to delete ALL vehicles?')">Clear All</a>
                <a href="/admin/vehicles/add" class="btn-add">+ Add Vehicle</a>
            </div>
        </div>

        <div class="table-wrap" th:if="${#lists.isEmpty(vehicles)}">
            <div class="empty-state">
                <p>No vehicles found. Add your first vehicle to get started.</p>
            </div>
        </div>

        <div class="table-wrap" th:unless="${#lists.isEmpty(vehicles)}">
            <table>
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Type</th>
                        <th>Company</th>
                        <th>Model</th>
                        <th>Number</th>
                        <th>Price/KM</th>
                        <th>Fuel</th>
                        <th>Available</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="vehicle : ${vehicles}">
                        <td th:text="${vehicle.id}"></td>
                        <td>
                            <span class="badge" th:classappend="${vehicle.type == 'CAR'} ? 'badge-car' : 'badge-bike'"
                                  th:text="${vehicle.type}"></span>
                        </td>
                        <td th:text="${vehicle.company}"></td>
                        <td th:text="${vehicle.model}"></td>
                        <td><strong th:text="${vehicle.vehicleNumber}"></strong></td>
                        <td th:text="'&#8377; ' + ${vehicle.pricePerKm}"></td>
                        <td th:text="${vehicle.fuelType}"></td>
                        <td>
                            <span class="badge" th:classappend="${vehicle.available} ? 'badge-yes' : 'badge-no'"
                                  th:text="${vehicle.available} ? 'Available' : 'Unavailable'"></span>
                        </td>
                        <td>
                            <div class="actions">
                                <a th:href="@{/admin/vehicles/edit/{id}(id=${vehicle.id})}" class="btn-edit">Edit</a>
                                <a th:href="@{/admin/vehicles/delete/{id}(id=${vehicle.id})}" class="btn-delete"
                                   onclick="return confirm('Are you sure you want to delete this vehicle?')">Delete</a>
                            </div>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <div class="footer">&copy; 2026 Car &amp; Bike Rental Admin Panel</div>

</body>
</html>
