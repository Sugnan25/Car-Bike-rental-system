<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Car &amp; Bike Rental</title>
    <link rel="stylesheet" th:href="@{/css/login.css}">
</head>
<body>

    <div class="left">
        <h1>Car &amp; Bike Rental</h1>
        <p>Access your account to manage bookings, view history, and rent vehicles instantly.</p>
    </div>

    <div class="right">
        <div class="form-box">
            <h2>Welcome Back</h2>
            <p class="subtitle">Sign in to continue to your dashboard</p>

            <div class="error-msg" id="errorMsg">
                Invalid email or password. Please try again.
            </div>

            <form th:action="@{/login}" method="post">
                <div class="form-group">
                    <label>Email Address</label>
                    <input type="email" name="username" placeholder="Enter your email" required>
                </div>

                <div class="form-group">
                    <label>Password</label>
                    <input type="password" name="password" placeholder="Enter your password" required>
                </div>

                <button type="submit" class="btn-submit">Sign In</button>
            </form>

            <div class="form-footer">
                Don't have an account? <a href="/register">Create One</a>
            </div>
        </div>
    </div>

</body>
</html>
