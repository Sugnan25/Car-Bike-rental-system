<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - Car &amp; Bike Rental</title>
    <link rel="stylesheet" th:href="@{/css/register.css}">
</head>
<body>

    <div class="left">
        <h1>Join Us Today</h1>
        <p>Create your account and start renting cars and bikes at the best prices in town.</p>
    </div>

    <div class="right">
        <div class="form-box">
            <h2>Create Account</h2>
            <p class="subtitle">Fill in your details to get started</p>

            <form th:action="@{/register}" th:object="${user}" method="post">

                <div class="form-group">
                    <label>Full Name</label>
                    <input type="text" th:field="*{fullName}" placeholder="John Doe" required>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label>Email Address</label>
                        <input type="email" th:field="*{email}" placeholder="john@email.com" required>
                    </div>
                    <div class="form-group">
                        <label>Phone Number</label>
                        <input type="text" th:field="*{phone}" placeholder="9876543210" required>
                    </div>
                </div>

                <div class="form-group">
                    <label>Password</label>
                    <div class="password-field">
                        <input type="password" id="password" th:field="*{password}" placeholder="Create a strong password" required>
                        <button type="button" class="toggle-password" aria-label="Show password"
                                onclick="togglePassword('password', this)">
                            <svg class="eye" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                                 stroke-linecap="round" stroke-linejoin="round">
                                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                                <circle cx="12" cy="12" r="3"></circle>
                            </svg>
                            <svg class="eye-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                                 stroke-linecap="round" stroke-linejoin="round">
                                <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
                                <line x1="1" y1="1" x2="23" y2="23"></line>
                            </svg>
                        </button>
                    </div>
                </div>

                <button type="submit" class="btn-submit">Create Account</button>
            </form>

            <div class="form-footer">
                Already have an account? <a href="/login">Sign In</a>
            </div>
        </div>
    </div>

    <script th:src="@{/js/password-toggle.js}"></script>

</body>
</html>
