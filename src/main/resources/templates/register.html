<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - Car &amp; Bike Rental</title>
    <link rel="stylesheet" th:href="@{/css/register.css}">
</head>
<body>

    <div class="left">
        <h1>Join Us Today</h1>
        <p>Create your account and start renting cars and bikes at the best prices in town.</p>
    </div>

    <div class="right">
        <div class="form-box">
            <h2>Create Account</h2>
            <p class="subtitle">Fill in your details to get started</p>

            <form th:action="@{/register}" th:object="${user}" method="post">

                <div class="form-group">
                    <label>Full Name</label>
                    <input type="text" th:field="*{fullName}" placeholder="John Doe" required>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label>Email Address</label>
                        <input type="email" th:field="*{email}" placeholder="john@email.com" required>
                    </div>
                    <div class="form-group">
                        <label>Phone Number</label>
                        <input type="text" th:field="*{phone}" placeholder="9876543210" required>
                    </div>
                </div>

                <div class="form-group">
                    <label>Password</label>
                    <input type="password" th:field="*{password}" placeholder="Create a strong password" required>
                </div>

                <button type="submit" class="btn-submit">Create Account</button>
            </form>

            <div class="form-footer">
                Already have an account? <a href="/login">Sign In</a>
            </div>
        </div>
    </div>

</body>
</html>
